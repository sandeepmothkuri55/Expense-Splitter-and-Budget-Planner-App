<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SplitSense – Expense Splitter & Budget Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}@media print{aside,.noprint{display:none!important}}</style></head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100"><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const CATS=["Food","Transportation","Shopping","Education","Entertainment","Healthcare","Rent","Electricity and Bills","Travel","Others"];
const PAL=['#7c3aed','#22c55e','#0ea5e9','#f59e0b','#ef4444','#6366f1','#14b8a6','#ec4899','#84cc16','#94a3b8'];
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
let token=localStorage.getItem('t');
async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status==401&&token){localStorage.removeItem('t');location.reload()}throw new Error(d.error||'Something went wrong')}return d}
function useLoad(p,dep=0){const[d,setD]=useState(null);const[n,setN]=useState(0);useEffect(()=>{api(p).then(setD).catch(()=>setD(false))},[p,n,dep]);return[d,()=>setN(x=>x+1)]}
const inp="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm";
const btn="rounded-lg bg-violet-600 hover:bg-violet-700 text-white px-4 py-2 text-sm font-semibold";
const Card=({t,children,c=''})=><div className={"rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 "+c}>{t&&<h3 className="font-semibold mb-3">{t}</h3>}{children}</div>;
const Stat=({l,v,c='text-slate-900 dark:text-white'})=><Card><div className="text-xs text-slate-500">{l}</div><div className={"text-2xl font-extrabold mt-1 "+c}>{v}</div></Card>;
const Empty=({t})=><p className="text-sm text-slate-500 py-6 text-center">{t}</p>;
function Chart({type,labels,sets}){const r=useRef();useEffect(()=>{const c=new Chart(r.current,{type,data:{labels,datasets:sets.map((s,i)=>({label:s.label,data:s.data,backgroundColor:type==='bar'||type==='line'?s.color:PAL,borderColor:s.color,tension:.3}))},options:{plugins:{legend:{display:sets.length>1||type!=='bar'&&type!=='line'}}}});return()=>c.destroy()},[JSON.stringify([labels,sets])]);return <canvas ref={r}/>}
function Err({e}){return e?<p className="text-sm text-red-600 mb-2" role="alert">{e}</p>:null}

function Auth({onAuth}){const[reg,setReg]=useState(false);const[f,setF]=useState({name:'',email:'',password:''});const[e,setE]=useState('');
const go=async()=>{try{const d=await api(reg?'register':'login','POST',f);token=d.token;localStorage.setItem('t',token);onAuth()}catch(x){setE(x.message)}};
return <div className="min-h-screen grid place-items-center bg-[#0f1b3d] p-4"><div className="w-full max-w-sm rounded-2xl bg-white p-6 text-slate-800"><h1 className="text-2xl font-extrabold text-[#0f1b3d]">SplitSense</h1><p className="text-sm text-slate-500 mb-4">Split bills. Plan budgets. Know where money goes.</p><Err e={e}/>
<div className="space-y-3">{reg&&<input className={inp} placeholder="Full name" value={f.name} onChange={x=>setF({...f,name:x.target.value})}/>}<input className={inp} type="email" placeholder="Email" value={f.email} onChange={x=>setF({...f,email:x.target.value})}/><input className={inp} type="password" placeholder="Password (6+ characters)" value={f.password} onChange={x=>setF({...f,password:x.target.value})} onKeyDown={x=>x.key==='Enter'&&go()}/><button className={btn+" w-full"} onClick={go}>{reg?'Create account':'Sign in'}</button></div>
<button className="text-sm text-violet-600 mt-4" onClick={()=>{setReg(!reg);setE('')}}>{reg?'Have an account? Sign in':'New here? Create an account'}</button></div></div>}

function Dashboard(){const[d]=useLoad('dashboard');if(!d)return <Empty t="Loading…"/>;
const col=d.pct>100?'text-red-600':d.pct>=80?'text-amber-500':'text-emerald-600';
return <div className="space-y-4"><div className="grid grid-cols-2 lg:grid-cols-4 gap-3"><Stat l="Monthly budget" v={d.budget?inr(d.budget):'Not set'}/><Stat l="Spent this month" v={inr(d.spent)}/><Stat l="Remaining" v={d.budget?inr(d.remaining):'–'} c={d.remaining<0?'text-red-600':'text-emerald-600'}/><Stat l="Budget used" v={d.budget?d.pct+'%':'–'} c={col}/><Stat l="You owe" v={inr(d.owe)} c="text-red-600"/><Stat l="You will receive" v={inr(d.receive)} c="text-emerald-600"/><Stat l="Income this month" v={inr(d.income)}/></div>
<div className="grid lg:grid-cols-2 gap-4"><Card t="Spending by category">{d.by_cat.length?<Chart type="doughnut" labels={d.by_cat.map(c=>c.category)} sets={[{label:'₹',data:d.by_cat.map(c=>c.total),color:'#7c3aed'}]}/>:<Empty t="No expenses this month yet."/>}</Card>
<Card t="Recent transactions">{d.recent.length?d.recent.map(e=><div key={e.id} className="flex justify-between py-2 border-b border-slate-100 dark:border-slate-800 text-sm"><span>{e.name}<span className="text-slate-500"> · {e.category}</span></span><b>{inr(e.amount)}</b></div>):<Empty t="Nothing here yet. Add your first expense."/>}</Card></div></div>}

function Expenses(){const blank={name:'',amount:'',category:'Food',date:today(),method:'Cash',notes:''};const[f,setF]=useState(blank);const[id,setId]=useState(null);const[s,setS]=useState('');const[cat,setCat]=useState('');const[e,setE]=useState('');
const[list,re]=useLoad('expenses?q='+encodeURIComponent(s)+'&category='+encodeURIComponent(cat));
const save=async()=>{try{await api(id?'expenses/'+id:'expenses',id?'PUT':'POST',f);setF(blank);setId(null);setE('');re()}catch(x){setE(x.message)}};
const set=k=>x=>setF({...f,[k]:x.target.value});
return <div className="grid lg:grid-cols-3 gap-4"><Card t={id?'Edit expense':'Add expense'}><Err e={e}/><div className="space-y-2"><input className={inp} placeholder="Expense name" value={f.name} onChange={set('name')}/><input className={inp} type="number" min="0" placeholder="Amount (₹)" value={f.amount} onChange={set('amount')}/><select className={inp} value={f.category} onChange={set('category')}>{CATS.map(c=><option key={c}>{c}</option>)}</select><input className={inp} type="date" value={f.date} onChange={set('date')}/><select className={inp} value={f.method} onChange={set('method')}>{['Cash','UPI','Credit card','Debit card','Net banking'].map(c=><option key={c}>{c}</option>)}</select><textarea className={inp} placeholder="Notes (optional)" value={f.notes} onChange={set('notes')}/><button className={btn} onClick={save}>{id?'Save changes':'Add expense'}</button>{id&&<button className="text-sm ml-3" onClick={()=>{setId(null);setF(blank)}}>Cancel</button>}</div></Card>
<div className="lg:col-span-2"><Card t="Transaction history"><div className="flex gap-2 mb-3"><input className={inp} placeholder="Search…" value={s} onChange={x=>setS(x.target.value)}/><select className={inp+" max-w-[10rem]"} value={cat} onChange={x=>setCat(x.target.value)}><option value="">All categories</option>{CATS.map(c=><option key={c}>{c}</option>)}</select></div>
{list&&list.length?list.map(x=><div key={x.id} className="flex justify-between items-center py-2 border-b border-slate-100 dark:border-slate-800 text-sm"><div><b>{x.name}</b><div className="text-xs text-slate-500">{x.date} · {x.category} · {x.method}</div></div><div className="flex gap-3 items-center"><b>{inr(x.amount)}</b><button className="text-violet-600" onClick={()=>{setId(x.id);setF({...x,notes:x.notes||''})}}>Edit</button><button className="text-red-600" onClick={async()=>{if(confirm('Delete this expense?')){await api('expenses/'+x.id,'DELETE');re()}}}>Delete</button></div></div>):<Empty t="No expenses match."/>}</Card></div></div>}

function Groups(){const[gs,reG]=useLoad('groups');const[sel,setSel]=useState(null);const[f,setF]=useState({name:'',members:''});const[e,setE]=useState('');
const create=async()=>{try{const r=await api('groups','POST',f);setF({name:'',members:''});setE('');reG();setSel(r.id)}catch(x){setE(x.message)}};
return <div className="grid lg:grid-cols-3 gap-4"><div className="space-y-4"><Card t="Create group"><Err e={e}/><div className="space-y-2"><input className={inp} placeholder="Group name" value={f.name} onChange={x=>setF({...f,name:x.target.value})}/><input className={inp} placeholder="Members, comma separated (you are added)" value={f.members} onChange={x=>setF({...f,members:x.target.value})}/><button className={btn} onClick={create}>Create group</button></div></Card>
<Card t="Your groups">{gs&&gs.length?gs.map(g=><button key={g.id} onClick={()=>setSel(g.id)} className={"block w-full text-left px-3 py-2 rounded-lg text-sm "+(sel===g.id?'bg-violet-100 dark:bg-violet-900/40':'')}>{g.name}</button>):<Empty t="No groups yet."/>}</Card></div>
<div className="lg:col-span-2">{sel?<Group id={sel} key={sel}/>:<Card><Empty t="Select or create a group to split expenses."/></Card>}</div></div>}

function Group({id}){const[d,re]=useLoad('groups/'+id);const[f,setF]=useState({title:'',amount:'',paid_by:'',participants:[]});const[nm,setNm]=useState('');const[e,setE]=useState('');
if(!d)return <Empty t="Loading…"/>;const name=i=>(d.members.find(m=>m.id===i)||{}).name;
const add=async()=>{try{await api(`groups/${id}/expenses`,'POST',{...f,paid_by:+f.paid_by});setF({title:'',amount:'',paid_by:'',participants:[]});setE('');re()}catch(x){setE(x.message)}};
const tog=i=>setF({...f,participants:f.participants.includes(i)?f.participants.filter(p=>p!==i):[...f.participants,i]});
return <div className="space-y-4"><Card t={d.group.name+' – balances'}>{d.members.map(m=>{const b=d.balances[m.id];return <div key={m.id} className="flex justify-between text-sm py-1"><span>{m.name}</span><b className={b<0?'text-red-600':b>0?'text-emerald-600':''}>{b>0?'gets back '+inr(b):b<0?'owes '+inr(-b):'settled'}</b></div>})}
<div className="flex gap-2 mt-3"><input className={inp} placeholder="Add member" value={nm} onChange={x=>setNm(x.target.value)}/><button className={btn} onClick={async()=>{try{await api(`groups/${id}/members`,'POST',{name:nm});setNm('');re()}catch(x){setE(x.message)}}}>Add</button></div></Card>
<Card t="Simplified settlement">{d.settle_plan.length?d.settle_plan.map((s,i)=><div key={i} className="flex justify-between items-center text-sm py-1"><span>{name(s.from)} pays {name(s.to)} <b>{inr(s.amount)}</b></span><button className="text-emerald-600 font-semibold" onClick={async()=>{await api(`groups/${id}/settle`,'POST',s);re()}}>Mark settled</button></div>):<Empty t="All settled up."/>}</Card>
<Card t="Add shared expense"><Err e={e}/><div className="space-y-2"><input className={inp} placeholder="What was it for?" value={f.title} onChange={x=>setF({...f,title:x.target.value})}/><input className={inp} type="number" placeholder="Total amount (₹)" value={f.amount} onChange={x=>setF({...f,amount:x.target.value})}/><select className={inp} value={f.paid_by} onChange={x=>setF({...f,paid_by:x.target.value})}><option value="">Who paid?</option>{d.members.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select>
<div className="flex flex-wrap gap-3 text-sm">{d.members.map(m=><label key={m.id}><input type="checkbox" checked={f.participants.includes(m.id)} onChange={()=>tog(m.id)}/> {m.name}</label>)}</div><button className={btn} onClick={add}>Split expense</button></div></Card>
<Card t="History">{d.expenses.map(x=><div key={x.id} className="text-sm py-1">{x.date} · {x.title} · <b>{inr(x.amount)}</b> paid by {name(x.paid_by)}, split {x.participants.length} ways</div>)}{d.settlements.map(s=><div key={'s'+s.id} className="text-sm py-1 text-emerald-600">{s.date} · {name(s.from_m)} paid {name(s.to_m)} {inr(s.amount)}</div>)}{!d.expenses.length&&<Empty t="No shared expenses yet."/>}</Card></div>}

function Budget(){const[b,re]=useLoad('budgets');const[v,setV]=useState({});const[e,setE]=useState('');
const save=async c=>{try{await api('budgets','PUT',{category:c,amount:v[c]});setE('');re()}catch(x){setE(x.message)}};
const row=(c,l)=>{const r=(b||[]).find(x=>x.category===c);const p=r&&r.budget?r.spent/r.budget*100:0;return <div key={c} className="py-3 border-b border-slate-100 dark:border-slate-800"><div className="flex gap-2 items-center"><span className="w-44 text-sm font-semibold">{l}</span><input className={inp+" max-w-[8rem]"} type="number" min="0" placeholder="₹ budget" value={v[c]??(r?r.budget:'')} onChange={x=>setV({...v,[c]:x.target.value})}/><button className={btn} onClick={()=>save(c)}>Save</button></div>{r&&r.budget>0&&<><div className="h-2 mt-2 rounded bg-slate-200 dark:bg-slate-800"><div className={"h-2 rounded "+(p>100?'bg-red-500':p>=80?'bg-amber-500':'bg-emerald-500')} style={{width:Math.min(p,100)+'%'}}/></div><div className="text-xs text-slate-500 mt-1">{inr(r.spent)} of {inr(r.budget)} ({p.toFixed(0)}%){p>100?' – over budget':p>=80?' – approaching limit':''}</div></>}</div>};
return <Card t="Monthly budget – planned vs actual"><Err e={e}/>{row('TOTAL','Total monthly budget')}{CATS.map(c=>row(c,c))}</Card>}

function Analytics(){const[a]=useLoad('analytics');const[inc,reI]=useLoad('income');const[f,setF]=useState({source:'',amount:'',date:today()});const[e,setE]=useState('');if(!a)return <Empty t="Loading…"/>;
const dl=async()=>{const r=await fetch('/api/export.csv',{headers:{Authorization:'Bearer '+token}});const u=URL.createObjectURL(await r.blob());Object.assign(document.createElement('a'),{href:u,download:'expenses.csv'}).click()};
return <div className="space-y-4"><div className="flex gap-2 noprint"><button className={btn} onClick={dl}>Download CSV</button><button className={btn} onClick={()=>window.print()}>Save as PDF</button></div>
<div className="grid lg:grid-cols-2 gap-4"><Card t="Income vs expense (6 months)"><Chart type="bar" labels={a.months} sets={[{label:'Income',data:a.income,color:'#22c55e'},{label:'Expense',data:a.expense,color:'#7c3aed'}]}/></Card>
<Card t="Monthly savings"><Chart type="line" labels={a.months} sets={[{label:'Savings',data:a.income.map((x,i)=>x-a.expense[i]),color:'#0ea5e9'}]}/></Card>
<Card t="Weekly spending">{a.weekly.length?<Chart type="bar" labels={a.weekly.map(w=>w.w)} sets={[{label:'₹',data:a.weekly.map(w=>w.total),color:'#7c3aed'}]}/>:<Empty t="No data yet."/>}</Card>
<Card t={a.top_category?`Categories – highest: ${a.top_category.category}`:'Categories'}>{a.by_cat.length?<Chart type="pie" labels={a.by_cat.map(c=>c.category)} sets={[{label:'₹',data:a.by_cat.map(c=>c.total),color:'#7c3aed'}]}/>:<Empty t="No data yet."/>}</Card></div>
<Card t="Record income"><Err e={e}/><div className="flex gap-2 flex-wrap"><input className={inp+" max-w-[10rem]"} placeholder="Source" value={f.source} onChange={x=>setF({...f,source:x.target.value})}/><input className={inp+" max-w-[8rem]"} type="number" placeholder="₹" value={f.amount} onChange={x=>setF({...f,amount:x.target.value})}/><input className={inp+" max-w-[10rem]"} type="date" value={f.date} onChange={x=>setF({...f,date:x.target.value})}/><button className={btn} onClick={async()=>{try{await api('income','POST',f);setF({source:'',amount:'',date:today()});setE('');reI()}catch(x){setE(x.message)}}}>Add income</button></div></Card></div>}

function Assistant(){const[i]=useLoad('insights');const[n]=useLoad('notifications');
return <div className="grid lg:grid-cols-2 gap-4"><Card t="Financial assistant">{i?<><ul className="list-disc pl-5 space-y-2 text-sm">{i.tips.map((t,k)=><li key={k}>{t}</li>)}</ul>{i.prediction&&<p className="mt-3 text-sm">Estimated spending this month: <b>{inr(i.prediction)}</b></p>}<p className="text-xs text-slate-500 mt-3">{i.disclaimer}</p></>:<Empty t="Loading…"/>}</Card>
<Card t="Notifications">{n&&n.length?n.map(x=><div key={x.id} className="text-sm py-2 border-b border-slate-100 dark:border-slate-800">{x.text}<span className="text-xs text-slate-500"> · {x.day}</span></div>):<Empty t="You are all caught up."/>}</Card></div>}

function App(){const[ok,setOk]=useState(!!token);const[pg,setPg]=useState('Dashboard');const[dark,setDark]=useState(localStorage.d==='1');
useEffect(()=>{document.documentElement.classList.toggle('dark',dark);localStorage.d=dark?'1':'0'},[dark]);
if(!ok)return <Auth onAuth={()=>setOk(true)}/>;
const P={Dashboard,Expenses,Groups,'Budget':Budget,Analytics,Assistant};const C=P[pg];
return <div className="md:flex min-h-screen"><aside className="md:w-56 bg-[#0f1b3d] text-white p-4 md:min-h-screen"><div className="text-xl font-extrabold mb-4">Split<span className="text-emerald-400">Sense</span></div><nav className="flex md:block gap-1 overflow-x-auto">{Object.keys(P).map(k=><button key={k} onClick={()=>setPg(k)} className={"block md:w-full text-left px-3 py-2 rounded-lg text-sm whitespace-nowrap "+(pg===k?'bg-violet-600':'hover:bg-white/10')}>{k}</button>)}</nav>
<div className="mt-4 text-sm space-y-2"><button onClick={()=>setDark(!dark)}>{dark?'Light mode':'Dark mode'}</button><br/><button onClick={()=>{localStorage.removeItem('t');token=null;setOk(false)}}>Sign out</button></div></aside>
<main className="flex-1 p-4 md:p-6 max-w-6xl"><h2 className="text-2xl font-extrabold mb-4">{pg}</h2><C key={pg}/></main></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
